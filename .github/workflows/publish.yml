name: Publish package

on:
  workflow_dispatch:
    inputs:
      target:
        description: Package index (dispatch on a tested version tag)
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require matching version tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_REF"] != f"refs/tags/v{version}":
              raise SystemExit("Dispatch this workflow on the matching version tag")
          PY
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&event=push" --jq 'any(.workflow_runs[]; .conclusion == "success")')
          test "$passed" = "true"
      - name: Install verification tools
        run: python -m pip install -e '.[dev]'
      - name: Verify and build release
        run: |
          pytest --cov=pydatarheo
          python scripts/verify_install.py
          python -m build
          python -m twine check dist/*
      - name: Verify release wheel in a fresh environment
        run: |
          python -m venv /tmp/pydatarheo-release
          /tmp/pydatarheo-release/bin/python -m pip install --no-index --no-deps dist/*.whl
          /tmp/pydatarheo-release/bin/python -I -c "import pydatarheo; print(pydatarheo.__version__)"
          /tmp/pydatarheo-release/bin/python -m pip check
          /tmp/pydatarheo-release/bin/pydatarheo --help
          /tmp/pydatarheo-release/bin/python -I examples/pipeline.py --output /tmp/pydatarheo-release-sales.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    needs: build
    if: inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
