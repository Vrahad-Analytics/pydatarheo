[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pydatarheo"
version = "1.0.0a1"
description = "Vrahad Analytics' native Python connector framework for streaming data pipelines."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Vrahad Analytics LLP" }]
requires-python = ">=3.10"
keywords = ["vrahad", "pydatarheo", "etl", "connectors", "streaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build==1.3.0",
    "hatchling==1.27.0",
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "coverage==7.10.7",
    "ruff==0.13.0",
    "twine==6.2.0",
    "mypy==1.18.2",
]

[project.scripts]
pydatarheo = "pydatarheo.cli:main"
pydr = "pydatarheo.cli:main"

[project.urls]
Homepage = "https://github.com/Vrahad-Analytics/pydatarheo"
Repository = "https://github.com/Vrahad-Analytics/pydatarheo"
Documentation = "https://github.com/Vrahad-Analytics/pydatarheo/blob/main/README.md"
Issues = "https://github.com/Vrahad-Analytics/pydatarheo/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pydatarheo"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/examples", "/scripts", "/pyproject.toml",
    "/README.md", "/ARCHITECTURE.md", "/INSTALL.md", "/CONTRIBUTING.md",
    "/CHANGELOG.md", "/LICENSE", "/NOTICE", "/AGENTS.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "integration: real local connector and sink integration (no secrets)",
    "e2e: complete user workflows, including an isolated wheel installation",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["pydatarheo"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
